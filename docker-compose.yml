version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  db:
    image: supabase/postgres:15.1.0.147
    container_name: assistant_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: supabase_password
      POSTGRES_DB: postgres
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: assistant_redis
    ports:
      - "6379:6379"
    restart: always

  # --- BACKEND ---
  backend:
    build:
      context: ./assistant_backend
      dockerfile: Dockerfile
    container_name: assistant_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:supabase_password@db:5432/postgres
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      - db
      - redis
    restart: always

  # --- FRONTEND ---
  web:
    build:
      context: ./assistant_backend/assistant_web
      dockerfile: Dockerfile
    container_name: assistant_web
    ports:
      - "80:80"
    environment:
      VITE_BACKEND_URL: http://localhost:3000
      VITE_SUPABASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: always

  # --- SUPABASE SERVICES (Minimal Stack) ---
  kong:
    image: kong:2.8.1
    container_name: assistant_kong
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./docker/kong/kong.yml:/etc/kong/kong.yml
    depends_on:
      - db

  # Auth service (GoTrue)
  auth:
    image: supabase/gotrue:v2.132.3
    container_name: assistant_auth
    depends_on:
      - db
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://postgres:supabase_password@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:80
      GOTRUE_JWT_SECRET: super-secret-jwt-token-replace-me
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"

  # API service (PostgREST)
  rest:
    image: postgrest/postgrest:v10.1.2
    container_name: assistant_postgrest
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgresql://postgres:supabase_password@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-replace-me

volumes:
  db_data:
