version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: assistant_redis
    ports:
      - "6379:6379"
    restart: always

  # Se o usuário quiser rodar o DB localmente em vez do Supabase para desenvolvimento, 
  # poderíamos adicionar um postgre aqui, mas como ele pediu Supabase, vou deixar apenas Redis.
